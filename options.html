<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Настройки Random 30 Digits Saver</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
    textarea { width: 100%; height: 200px; margin-bottom: 10px; font-family: monospace; padding: 10px; box-sizing: border-box;}
    button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { background: #0056b3; }
    .status { margin-top: 10px; color: green; font-weight: bold; display: none;}
    .help-text { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 15px;}
  </style>
</head>
<body>
  <h2>Паттерны "плохих" имен</h2>
  <div class="help-text">
    Каждое правило с новой строки. Можно использовать простые слова (например, <code>download</code>) или регулярные выражения, обернутые в слэши (например, <code>/^img_\d+/</code>).
  </div>
  <textarea id="patternsList"></textarea>
  <button id="saveBtn">Сохранить</button>
  <div id="status" class="status">Настройки сохранены!</div>

  <script src="options.js"></script>
</body>
</html>
